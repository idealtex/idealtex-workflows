name: Validate application
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate application identity
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          case "$SERVICE_NAME" in mono|web-admin|web-public) ;; *) exit 1 ;; esac
          test -f scripts/ci.sh
      - uses: actions/setup-dotnet@v5
        if: inputs.service_name == 'mono'
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        if: inputs.service_name != 'mono'
        with:
          node-version: 24.14.0
          cache: npm
      - name: Build and test
        run: bash scripts/ci.sh
      - uses: docker/setup-buildx-action@v3
      - name: Validate container build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.service_name == 'mono' && 'Dockerfile' || 'dockerfile' }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
