name: Publish application image
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  validation:
    uses: ./.github/workflows/workflow-services-validation.yml
    with:
      service_name: ${{ inputs.service_name }}
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reserve or reuse a version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          def parse(tag):
              match = re.fullmatch(r"v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
              return tuple(map(int, match.groups())) if match else None
          def bump(version, branch):
              major, minor, patch = version
              if branch.startswith("major/"): return major + 1, 0, 0
              if branch.startswith("feature/"): return major, minor + 1, 0
              return major, minor, patch + 1
          assert parse("v1.2.3") == (1, 2, 3) and parse("01.2.3") is None
          assert bump((1, 2, 3), "feature/a") == (1, 3, 0)
          assert bump((1, 2, 3), "major/a") == (2, 0, 0)
          assert bump((1, 2, 3), "main") == (1, 2, 4)
          run("git", "fetch", "--tags", "origin")
          sha = os.environ["GITHUB_SHA"]
          assert run("git", "rev-parse", "HEAD") == sha
          current = [t for t in run("git", "tag", "--points-at", "HEAD").splitlines() if t.startswith("v") and parse(t)]
          if len(current) > 1: raise SystemExit("Multiple release tags point to this commit; review manually")
          if current:
              tag = current[0]
          else:
              tags = [parse(t) for t in run("git", "tag", "--list").splitlines()]
              latest = max((v for v in tags if v), default=(0, 0, 0))
              pulls = json.loads(run("gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{sha}/pulls"))
              merged = [p for p in pulls if p.get("merged_at") and p["base"]["ref"] == "main"]
              branch = max(merged, key=lambda p: p["merged_at"])["head"]["ref"] if merged else "main"
              tag = "v" + ".".join(map(str, bump(latest, branch)))
              run("git", "config", "user.name", "github-actions[bot]")
              run("git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
              run("git", "tag", "-a", tag, "-m", f"Release {tag}", sha)
              run("git", "push", "origin", f"refs/tags/{tag}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\n")
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Protect existing image tags
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2> "$RUNNER_TEMP/manifest-error"; then
            docker pull "$IMAGE"
            revision="$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            test "$revision" = "$GITHUB_SHA" || { echo "Existing tag belongs to another or unverified build" >&2; exit 1; }
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest unknown|no such manifest|not found' "$RUNNER_TEMP/manifest-error"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/manifest-error" >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        if: steps.image.outputs.exists != 'true'
        with:
          context: .
          file: ${{ inputs.service_name == 'mono' && 'Dockerfile' || 'dockerfile' }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update latest image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
          LATEST_IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            docker buildx imagetools create --prefer-index=false --tag "$LATEST_IMAGE" "$IMAGE"
            printf 'DEV image: %s\n\n' "$LATEST_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Skipped latest: this commit is no longer the main branch head.\n\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record published version
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
        run: |
          printf 'Versioned image: %s\n\nSelect the version tag for PROD or latest for DEV in Dokploy, then deploy manually.\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
        
      
